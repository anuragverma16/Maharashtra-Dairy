# Render Blueprint: one Node web service that serves the React site and the API.
# MongoDB is NOT provisioned here (Render has no managed MongoDB). Use MongoDB Atlas
# and paste its connection string into MONGO_URI in the Render dashboard.
services:
  - type: web
    name: maharashtra-dairy
    runtime: node
    plan: free
    rootDir: server
    # Install server and client separately (each has its own lockfile with Linux binaries)
    buildCommand: "npm install --prefix ../server && npm install --prefix ../client && npm run build --prefix ../client"
    startCommand: "npm start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 24h
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrator
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
